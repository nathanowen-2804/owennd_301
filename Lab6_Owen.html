<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        *{
            box-sizing: border-box;
        }
        .flex{
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            height: 100vh;
            align-items: center;
            width: 100vw;
        }
       
    </style>
</head>
<body>
    <div class="flex">
        <img src="https://picsum.photos/130/130?random=1" alt="random">
        <img src="https://picsum.photos/200/200?random=2" alt="random">
        <img src="https://picsum.photos/130/130?random=3" alt="random">
    </div>
</body>
</html>
